[workspace]
members = [
    "quiccrunch-core",
    "quiccrunch-macros",
    "quiccrunch-cli",
    "quiccrunch-ffi",
    "benchmark_comparison/grpc",
    "benchmark_comparison/quiccrunch",
    # "quiccrunch-security", # Temporarily disabled due to missing dependencies
    # "tests/load-testing", # Temporarily disabled - directory removed for space
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies for all workspace members
tokio = { version = "1.35.1", features = ["full"] }
capnp = "0.23.0"
futures = "0.3.30"
bytes = "1.5.0"
thiserror = "1.0.56"
tracing = "0.1.40"
async-trait = "0.1.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
mio = { version = "1.0.4", features = ["net", "os-poll"] }
jsonwebtoken = "9.2"


# Procedural macro dependencies
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
darling = "0.20"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Workspace-level profiles optimized for caching
[profile.dev]
opt-level = 1
overflow-checks = true
debug = true
split-debuginfo = "unpacked"   # Faster debug info generation
incremental = true
codegen-units = 256           # More units for faster parallel compilation

[profile.release]
opt-level = 3
lto = "thin"                  # Use thin LTO instead of full LTO for faster builds
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"             # Strip symbols for smaller binaries
incremental = false           # Disable incremental for release builds

[profile.bench]
inherits = "release"
debug = true
strip = "none"                # Keep debug info for profiling

# Fast development profile for feature testing
[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
codegen-units = 512
