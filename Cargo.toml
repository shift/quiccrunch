[workspace]
members = [
    "quiccrunch-core",
    "quiccrunch-macros",
    "quiccrunch-cli",
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies for all workspace members
tokio = { version = "1.35.1", features = ["full"] }
capnp = "0.18.10"
futures = "0.3.30"
bytes = "1.5.0"
thiserror = "1.0.56"
tracing = "0.1.40"
async-trait = "0.1.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Procedural macro dependencies
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
darling = "0.20"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Workspace-level profiles
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 1
overflow-checks = true