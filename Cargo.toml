[package]
name = "quiccrunch"
version = "0.1.0"
edition = "2021"
description = "High-performance RPC library using QUIC and Cap'n Proto"
license = "MIT OR Apache-2.0"

[dependencies]
quinn = "0.10.2"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "svg_backend", "line_series"], optional = true }
tokio = { version = "1.35.1", features = ["full"] }
capnp = "0.18.10"
futures = "0.3.30"
bytes = "1.5.0"
thiserror = "1.0.56"
tracing = "0.1.40"
async-trait = "0.1.77"
rcgen = "0.12.1"
rustls = { version = "0.21.10", features = ["dangerous_configuration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
lazy_static = "1.4"

# Optional OpenTelemetry support
opentelemetry = { version = "0.21", optional = true }
opentelemetry_sdk = { version = "0.21", optional = true }
opentelemetry-semantic-conventions = { version = "0.13", optional = true }
opentelemetry-http = { version = "0.10", optional = true }
opentelemetry-jaeger = { version = "0.20", optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Dependencies for examples
[dev-dependencies.opentelemetry]
version = "0.21"

[dev-dependencies.opentelemetry_sdk]
version = "0.21"
features = ["rt-tokio"]

[dev-dependencies.opentelemetry-jaeger]
version = "0.20"

[dev-dependencies.tracing-opentelemetry]
version = "0.22"

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dev-dependencies]
tokio-test = "0.4.3"
anyhow = "1.0"
portpicker = "0.1"
fastrand = "1.9"
criterion = { version = "0.5.1", features = ["html_reports"] }
proptest = "1.4"
test-log = "0.2"
tracing-test = "0.2"
rand = "0.8"
hex = "0.4"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "svg_backend", "line_series"] }
stats_alloc = "0.1"
parking_lot = "0.12"
chrono = "0.4"
glob = "0.3"
cucumber = { version = "0.21", features = ["macros"] }

[build-dependencies]
capnpc = "0.18.0"

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "patterns"
harness = false

[[bench]]
name = "profiles"
harness = false

[[bench]]
name = "io_uring_comparison"
harness = false

[features]
# Backends
backend-quinn = []
backend-alt = []

# Default features
default = ["tls", "visualization", "backend-quinn"]

tls = []
visualization = ["plotters"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-semantic-conventions",
    "dep:opentelemetry-http",
    "dep:opentelemetry-jaeger",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber"
]
