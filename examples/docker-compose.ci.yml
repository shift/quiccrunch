version: '3.8'

# Docker Compose configuration for CI/CD testing
# This file is optimized for automated testing environments

services:
  # Calculator Service for testing
  calculator-server-ci:
    build:
      context: ./applications/calculator
      dockerfile: Dockerfile
      cache_from:
        - rust:1.75-slim
    ports:
      - "50051:50051/udp"
    environment:
      - RUST_LOG=warn  # Reduced logging for CI
      - RUST_BACKTRACE=1
    command: ["calculator-server", "--address", "0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "calculator-client", "--server", "127.0.0.1:50051", "--operation", "add", "--a", "1", "--b", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    stop_grace_period: 10s

  # Chat Service for testing
  chat-server-ci:
    build:
      context: ./applications/chat-service
      dockerfile: Dockerfile
      cache_from:
        - rust:1.75-slim
    ports:
      - "50052:50051/udp"
    environment:
      - RUST_LOG=warn
      - RUST_BACKTRACE=1
    command: ["chat-server", "--address", "0.0.0.0:50051", "--max-rooms", "5", "--max-users-per-room", "20"]
    healthcheck:
      test: ["CMD", "timeout", "5", "sh", "-c", "echo '{\"ListRooms\":null}' | nc -u 127.0.0.1 50051 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    stop_grace_period: 10s

  # Echo Service for testing
  echo-server-ci:
    build:
      context: ./applications/echo-service
      dockerfile: Dockerfile
      cache_from:
        - rust:1.75-slim
    ports:
      - "50053:50051/udp"
    environment:
      - RUST_LOG=warn
      - RUST_BACKTRACE=1
    command: ["echo-server", "--address", "0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "timeout", "5", "sh", "-c", "echo 'health' | nc -u 127.0.0.1 50051 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    stop_grace_period: 10s

  # Unit Tests
  unit-tests:
    build:
      context: ../..
      dockerfile: examples/containers/testing/Dockerfile
      cache_from:
        - rust:1.75-slim
    volumes:
      - ../..:/workspace:ro
    working_dir: /workspace
    environment:
      - RUST_LOG=warn
      - CARGO_TARGET_DIR=/tmp/target
    command: ["cargo", "test", "--workspace", "--verbose"]
    profiles: ["test"]

  # Integration Tests
  integration-tests:
    build:
      context: ../..
      dockerfile: examples/containers/testing/Dockerfile
      cache_from:
        - rust:1.75-slim
    volumes:
      - ../..:/workspace:ro
      - test-results:/workspace/test-results
    working_dir: /workspace
    environment:
      - CALCULATOR_SERVER=calculator-server-ci:50051
      - CHAT_SERVER=chat-server-ci:50051
      - ECHO_SERVER=echo-server-ci:50051
      - RUST_LOG=warn
      - CARGO_TARGET_DIR=/tmp/target
    depends_on:
      calculator-server-ci:
        condition: service_healthy
      chat-server-ci:
        condition: service_healthy
      echo-server-ci:
        condition: service_healthy
    command: |
      bash -c "
        echo 'Running integration tests...' &&
        cargo test --manifest-path tests/integration/Cargo.toml --verbose -- --test-threads=1 &&
        echo 'Integration tests completed successfully!'
      "
    profiles: ["test"]

  # Performance Tests
  performance-tests:
    build:
      context: ../..
      dockerfile: examples/containers/benchmarking/Dockerfile
      cache_from:
        - rust:1.75-slim
    volumes:
      - ../..:/workspace:ro
      - benchmark-results:/results
    working_dir: /workspace
    environment:
      - CALCULATOR_SERVER=calculator-server-ci:50051
      - CHAT_SERVER=chat-server-ci:50051
      - ECHO_SERVER=echo-server-ci:50051
      - BENCHMARK_DURATION=30s
      - BENCHMARK_CONNECTIONS=20
    depends_on:
      calculator-server-ci:
        condition: service_healthy
      chat-server-ci:
        condition: service_healthy
      echo-server-ci:
        condition: service_healthy
    command: |
      bash -c "
        echo 'Running performance tests...' &&
        latency-test.sh &&
        throughput-test.sh &&
        echo 'Performance tests completed!' &&
        ls -la /results/
      "
    profiles: ["benchmark"]

  # Linting and Code Quality
  code-quality:
    build:
      context: ../..
      dockerfile: examples/containers/development/Dockerfile
      cache_from:
        - rust:1.75-slim
    volumes:
      - ../..:/workspace:ro
    working_dir: /workspace
    environment:
      - CARGO_TARGET_DIR=/tmp/target
    command: |
      bash -c "
        echo 'Running code quality checks...' &&
        cargo fmt --all -- --check &&
        cargo clippy --workspace --all-targets -- -D warnings &&
        cargo audit &&
        echo 'Code quality checks passed!'
      "
    profiles: ["quality"]

  # Documentation Generation
  docs-generation:
    build:
      context: ../..
      dockerfile: examples/containers/development/Dockerfile
      cache_from:
        - rust:1.75-slim
    volumes:
      - ../..:/workspace:ro
      - docs-output:/workspace/target/doc
    working_dir: /workspace
    environment:
      - CARGO_TARGET_DIR=/tmp/target
    command: |
      bash -c "
        echo 'Generating documentation...' &&
        cargo doc --workspace --no-deps --document-private-items &&
        echo 'Documentation generated successfully!' &&
        ls -la /tmp/target/doc/
      "
    profiles: ["docs"]

volumes:
  test-results:
  benchmark-results:
  docs-output:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16