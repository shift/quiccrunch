events {
    worker_connections 1024;
}

http {
    upstream quiccrunch_backend {
        # Multiple QuicCrunch server instances for load balancing
        server quiccrunch-server:9090 max_fails=3 fail_timeout=30s;
        # Add more servers as needed:
        # server quiccrunch-server-2:9090 max_fails=3 fail_timeout=30s;
    }
    
    upstream prometheus_backend {
        server prometheus:9090;
    }
    
    upstream grafana_backend {
        server grafana:3000;
    }
    
    upstream alertmanager_backend {
        server alertmanager:9093;
    }
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=20r/m;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # QuicCrunch Metrics API
    server {
        listen 80;
        server_name metrics.quiccrunch.local;
        
        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name metrics.quiccrunch.local;
        
        ssl_certificate /etc/nginx/ssl/quiccrunch.crt;
        ssl_certificate_key /etc/nginx/ssl/quiccrunch.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        location /metrics {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://quiccrunch_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Health check
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        location /health {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://quiccrunch_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Deny other paths
        location / {
            return 404;
        }
    }
    
    # Prometheus
    server {
        listen 80;
        server_name prometheus.quiccrunch.local;
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name prometheus.quiccrunch.local;
        
        ssl_certificate /etc/nginx/ssl/quiccrunch.crt;
        ssl_certificate_key /etc/nginx/ssl/quiccrunch.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # Basic auth for security (optional)
        # auth_basic "Prometheus";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        location / {
            limit_req zone=dashboard burst=10 nodelay;
            proxy_pass http://prometheus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # Grafana
    server {
        listen 80;
        server_name grafana.quiccrunch.local;
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name grafana.quiccrunch.local;
        
        ssl_certificate /etc/nginx/ssl/quiccrunch.crt;
        ssl_certificate_key /etc/nginx/ssl/quiccrunch.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        location / {
            limit_req zone=dashboard burst=10 nodelay;
            proxy_pass http://grafana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # AlertManager
    server {
        listen 80;
        server_name alerts.quiccrunch.local;
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name alerts.quiccrunch.local;
        
        ssl_certificate /etc/nginx/ssl/quiccrunch.crt;
        ssl_certificate_key /etc/nginx/ssl/quiccrunch.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        location / {
            limit_req zone=dashboard burst=10 nodelay;
            proxy_pass http://alertmanager_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # Default server (catch-all)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        
        ssl_certificate /etc/nginx/ssl/quiccrunch.crt;
        ssl_certificate_key /etc/nginx/ssl/quiccrunch.key;
        
        return 444; # Close connection without response
    }
}