version: '3.8'

services:
  quiccrunch-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: quiccrunch-server-dev
    ports:
      - "50051:50051/udp"  # QUIC server port
      - "9090:9090"        # Prometheus metrics
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    volumes:
      - ./configs/server-config.toml:/app/config.toml:ro
      - quiccrunch-certs:/app/certs
      - quiccrunch-data:/app/data
    networks:
      - quiccrunch-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "quiccrunch", "health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: quiccrunch-prometheus-dev
    ports:
      - "9091:9090"
    volumes:
      - ../monitoring/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - quiccrunch-net
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: quiccrunch-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - quiccrunch-net
    restart: unless-stopped
    depends_on:
      - prometheus

  # Development tools container
  quiccrunch-tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    container_name: quiccrunch-tools-dev
    volumes:
      - ..:/workspace:ro
      - quiccrunch-certs:/app/certs
    networks:
      - quiccrunch-net
    profiles:
      - tools
    entrypoint: ["tail", "-f", "/dev/null"]  # Keep container running for exec

networks:
  quiccrunch-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  quiccrunch-certs:
  quiccrunch-data:
  prometheus-data:
  grafana-data: