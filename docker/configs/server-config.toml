# QuicCrunch Server Configuration
# Production-ready configuration with security and monitoring

[server]
# Network configuration
bind_address = "0.0.0.0:50051"
max_connections = 10000
connection_timeout = "30s"
keep_alive_interval = "5s"

# Performance tuning
max_concurrent_streams = 1000
initial_window_size = 65535
max_window_size = 16777215
receive_window = 1048576
send_window = 1048576

# TLS Configuration
[tls]
cert_path = "/app/certs/server.crt"
key_path = "/app/certs/server.key"
ca_cert_path = "/app/certs/ca.crt"
# Auto-generate certificates if not found
auto_generate = true

# Monitoring and observability
[monitoring]
metrics_enabled = true
metrics_address = "0.0.0.0:9090"
tracing_enabled = true
log_level = "info"

# Export Prometheus metrics
[metrics]
enable_prometheus = true
prometheus_port = 9090
histogram_buckets = [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0, 5.0, 10.0]

# Power monitoring (if available)
[power]
enabled = false
sample_interval = "1s"

# Security settings
[security]
# Require client certificates
require_client_cert = false
# Maximum message size (1MB)
max_message_size = 1048576
# Rate limiting
max_requests_per_second = 1000