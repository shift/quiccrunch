[package]
name = "comparison"
version = "0.1.0-alpha.1"
edition = "2021"
publish = false
description = "Same-shape head-to-head benchmark: tonic/h2 vs QuicCrunch"
license = "MIT OR Apache-2.0"

[dependencies]
quiccrunch-core = { path = "../quiccrunch-core" }

tokio = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
tokio-stream = "0.1"
hdrhistogram = "7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

[build-dependencies]
tonic-build = "0.12"