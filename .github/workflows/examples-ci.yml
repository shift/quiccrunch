name: QuicCrunch Examples CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'examples/**'
      - 'quiccrunch-core/**'
      - 'quiccrunch-macros/**'
      - '.github/workflows/examples-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'examples/**'
      - 'quiccrunch-core/**'
      - 'quiccrunch-macros/**'

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Validation and linting
  validate:
    name: Validate Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate examples setup
        working-directory: examples
        run: |
          chmod +x scripts/validate-setup.sh
          ./scripts/validate-setup.sh

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run code quality checks
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml --profile quality up --abort-on-container-exit code-quality

  # Build all example applications
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application: [calculator, chat-service, echo-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.application }}
        working-directory: examples
        run: |
          docker-compose build ${{ matrix.application }}-server

      - name: Test ${{ matrix.application }} image
        working-directory: examples
        run: |
          # Start the service
          docker-compose up -d ${{ matrix.application }}-server
          
          # Wait for health check
          timeout 60 bash -c 'until docker-compose ps ${{ matrix.application }}-server | grep -q "healthy"; do sleep 2; done'
          
          # Clean up
          docker-compose down

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml --profile test up --abort-on-container-exit unit-tests

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml up -d calculator-server-ci chat-server-ci echo-server-ci

      - name: Wait for services to be ready
        working-directory: examples
        run: |
          timeout 120 bash -c 'until docker-compose -f docker-compose.ci.yml ps | grep -q "healthy"; do sleep 5; done'

      - name: Run integration tests
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml --profile test up --abort-on-container-exit integration-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: examples/test-results/

      - name: Stop services
        if: always()
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml down

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'performance')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml up -d calculator-server-ci chat-server-ci echo-server-ci

      - name: Wait for services to be ready
        working-directory: examples
        run: |
          timeout 120 bash -c 'until docker-compose -f docker-compose.ci.yml ps | grep -q "healthy"; do sleep 5; done'

      - name: Run performance benchmarks
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml --profile benchmark up --abort-on-container-exit performance-tests

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: examples/benchmark-results/

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('examples/benchmark-results/benchmark-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Performance Benchmark Results\n\n${summary}`
              });
            } catch (error) {
              console.log('No benchmark summary found');
            }

      - name: Stop services
        if: always()
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml down

  # Documentation generation
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate documentation
        working-directory: examples
        run: |
          docker-compose -f docker-compose.ci.yml --profile docs up --abort-on-container-exit docs-generation

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: examples/docs-output/

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'examples/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Multi-architecture build (for releases)
  multi-arch-build:
    name: Multi-Architecture Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        application: [calculator, chat-service, echo-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-architecture image
        working-directory: examples/applications/${{ matrix.application }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag quiccrunch-${{ matrix.application }}:latest \
            .

  # Notify on completion
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [validate, code-quality, unit-tests, integration-tests]
    if: always()
    steps:
      - name: Notify success
        if: ${{ needs.validate.result == 'success' && needs.code-quality.result == 'success' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' }}
        run: |
          echo "✅ All QuicCrunch example tests passed!"

      - name: Notify failure
        if: ${{ needs.validate.result == 'failure' || needs.code-quality.result == 'failure' || needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' }}
        run: |
          echo "❌ Some QuicCrunch example tests failed!"
          exit 1