name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository }}/server
  IMAGE_NAME_CLI: ${{ github.repository }}/cli

jobs:
  # Existing test and security jobs (keep as is)
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang pkg-config libssl-dev

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy linting
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose --all-features

    - name: Run tests
      run: cargo test --verbose --all-features
      env:
        HEADLESS_PLOT: 1

    - name: Run doctests
      run: cargo test --doc --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # New Docker build and push job
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for server image
      id: meta-server
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata for CLI image
      id: meta-cli
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLI }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push server image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.server
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-server.outputs.tags }}
        labels: ${{ steps.meta-server.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push CLI image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.cli
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-cli.outputs.tags }}
        labels: ${{ steps.meta-cli.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to staging with Docker Compose
      run: |
        # Setup staging environment
        echo "QUICCRUNCH_VERSION=${{ github.sha }}" > .env
        echo "ENVIRONMENT=staging" >> .env
        
        # Deploy using docker-compose
        docker-compose -f docker/docker-compose.prod.yml up -d
        
        # Wait for services to be ready
        timeout 300 bash -c 'until curl -sf http://localhost:9090/metrics; do sleep 5; done'
        
        # Run health checks
        ./deploy/scripts/health-check.sh staging

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Deploy to production with rolling update
      run: |
        # Setup production environment
        echo "QUICCRUNCH_VERSION=${{ steps.version.outputs.VERSION }}" > .env
        echo "ENVIRONMENT=prod" >> .env
        
        # Run deployment script
        ./deploy/scripts/deploy.sh prod ${{ steps.version.outputs.VERSION }}

    - name: Verify production deployment
      run: |
        # Run comprehensive health checks
        ./deploy/scripts/health-check.sh prod

  # Security scanning for container images
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Performance benchmarks with containerized environment
  benchmark-containerized:
    name: Containerized Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Docker Compose for benchmarking
      run: |
        echo "QUICCRUNCH_VERSION=${{ github.sha }}" > .env
        echo "ENVIRONMENT=dev" >> .env

    - name: Start QuicCrunch services
      run: |
        docker-compose -f docker/docker-compose.dev.yml up -d
        
        # Wait for services to be ready
        timeout 300 bash -c 'until curl -sf http://localhost:9090/metrics; do sleep 5; done'

    - name: Run performance benchmarks
      run: |
        # Run benchmarks against the containerized service
        docker run --rm --network container:quiccrunch-server-dev \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLI }}:${{ github.sha }} \
          benchmark --target localhost:50051 --duration 60s --connections 100

    - name: Collect metrics
      run: |
        # Export Prometheus metrics for analysis
        curl -s http://localhost:9091/api/v1/query_range?query=rate%28quiccrunch_requests_total%5B5m%5D%29 > benchmark-metrics.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: |
          benchmark-metrics.json
          *.log

    - name: Cleanup
      if: always()
      run: docker-compose -f docker/docker-compose.dev.yml down -v