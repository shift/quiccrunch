name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that does not match the workspace version produces artefacts
      # whose filename and provenance disagree. Fail before building anything.
      - name: Tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' quiccrunch-core/Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "workspace version: ${version}"
          echo "tag version:       ${tag_version}"
          if [[ -z "${version}" || "${version}" != "${tag_version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

          # The workspace crates, plus the crates excluded from the workspace
          # but shipped in-tree, must move together.
          crates=(
            quiccrunch-core
            quiccrunch-macros
            quiccrunch-cli
            comparison
            raft-compare
            quiccrunch-security
            quiccrunch-ffi
            bindings/python
          )
          for crate in "${crates[@]}"; do
            crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "${crate}/Cargo.toml" | head -n1)"
            if [[ "${crate_version}" != "${version}" ]]; then
              echo "::error::${crate} has version ${crate_version}, expected ${version}"
              exit 1
            fi
          done

  build-release:
    name: Build x86_64-unknown-linux-gnu
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Linux x86_64 only for v0.1.0-alpha.1. The multi-worker server relies on
      # Linux SO_REUSEPORT and the vendored tQUIC/BoringSSL build has not been
      # verified on Windows or macOS. The previous matrix marked those jobs
      # `continue-on-error`, so a green release could silently omit their
      # binaries. Do not add a target back until it is actually verified.
      - name: Build CLI
        run: nix develop -c cargo build --release --bin quiccrunch

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          tar czf "dist/quiccrunch-cli-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release quiccrunch

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: quiccrunch-cli-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub pre-release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: QuicCrunch ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: true
          fail_on_unmatched_files: true

  # crates.io publishing is deliberately absent for this alpha. The crates have
  # never been published, and v0.1.0-alpha.1 is a git tag plus release artefact.
  # Add a publish job only when registry publication is an intentional decision.
