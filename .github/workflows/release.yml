name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: quiccrunch-cli
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: quiccrunch-cli.exe
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            executable: quiccrunch-cli
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake

      # tQUIC vendors BoringSSL (CMake/NASM). Cross-OS support has not been
      # verified from this repository's Linux CI, so non-Linux builds are
      # allowed to fail without blocking the Linux release asset.
      - name: Allow unverified non-Linux builds
        if: matrix.os != 'ubuntu-latest'
        run: echo "Non-Linux release builds are non-blocking pending verification"

      - name: Build CLI
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        run: cargo build --release --bin quiccrunch --target ${{ matrix.target }}

      - name: Create archive
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "dist/quiccrunch-cli-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/${{ matrix.executable }}"
          else
            tar czf "dist/quiccrunch-cli-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.executable }}"
          fi

      - name: Upload archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quiccrunch-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-crate:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev

      - name: Publish quiccrunch-macros
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --package quiccrunch-macros

      - name: Wait for quiccrunch-macros to be available
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: sleep 30

      - name: Publish quiccrunch-core
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --package quiccrunch-core

      - name: Wait for quiccrunch-core to be available
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: sleep 30

      - name: Publish quiccrunch-cli
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --package quiccrunch-cli
