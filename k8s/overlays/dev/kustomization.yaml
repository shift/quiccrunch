apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quiccrunch-dev

resources:
- ../../base

patchesStrategicMerge:
- deployment-patches.yaml

commonLabels:
  environment: dev

replicas:
- name: quiccrunch-server
  count: 1
- name: prometheus
  count: 1
- name: grafana
  count: 1

images:
- name: quiccrunch/server
  newTag: dev