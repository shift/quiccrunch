[package]
name = "quiccrunch-macros"
version = "0.1.0"
edition = "2021"
authors = ["QuicCrunch Contributors"]
description = "Procedural macros for QuicCrunch RPC framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shift/quickcrunch"
documentation = "https://docs.rs/quiccrunch-macros"
readme = "README.md"
keywords = ["quic", "rpc", "macros", "codegen"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
darling = "0.20"
capnp = "0.18.10"

[dev-dependencies]
trybuild = "1.0"
tokio = { version = "1.35.1", features = ["full"] }