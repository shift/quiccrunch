[package]
name = "quiccrunch-load-testing"
version = "0.1.0"
edition = "2021"

[dependencies]
quiccrunch-core = { path = "../../quiccrunch-core" }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
plotters = { version = "0.3", features = ["all_elements"], optional = true }
histogram = "0.8"
hdrhistogram = "7.5"
futures = "0.3"
async-trait = "0.1"
dashmap = "6.0"
parking_lot = "0.12"
num_cpus = "1.0"
hostname = "0.4"

# Performance monitoring
tinytemplate = "1.2"
handlebars = "6.0"

# Test data generation
fake = { version = "2.9", features = ["derive", "uuid"] }
quickcheck = "1.0"
proptest = "1.0"

# Metrics and monitoring
prometheus = "0.13"
once_cell = "1.19"

# Time parsing
humantime = "2.1"
humantime-serde = "1.1"

# Config parsing
toml = "0.8"

[features]
default = []
visualization = ["plotters"]
heavy-load = []

[[bin]]
name = "load-test"
path = "src/bin/load_test.rs"

[[bin]]
name = "stress-test"
path = "src/bin/stress_test.rs"

[[bin]]
name = "e2e-test"
path = "src/bin/e2e_test.rs"

[[bin]]
name = "regression-test"
path = "src/bin/regression_test.rs"

[[bin]]
name = "load-dashboard"
path = "src/bin/dashboard.rs"