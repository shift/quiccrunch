# QuicCrunch Load Testing Configuration

[scenarios.simple]
name = "Simple Load Test"
description = "Basic functionality validation under load"
duration = "60s"
connections = 100
backend = "quinn"

[scenarios.simple.request_rate]
type = "Constant"
rate = 1000

[scenarios.simple.message_size]
type = "Fixed"
size = 1024

[scenarios.realistic]
name = "Realistic Workload"
description = "Production-like traffic patterns"
duration = "300s"
connections = 500
backend = "quinn"

[scenarios.realistic.request_rate]
type = "Variable"
pattern = "sine"
base_rate = 2000
variation = 0.3

[scenarios.realistic.message_size]
type = "Distribution"
pattern = "realistic"

[scenarios.streaming]
name = "Streaming RPC Test"
description = "Validate streaming RPC performance"
duration = "180s"
connections = 200
backend = "quinn"

[scenarios.streaming.request_rate]
type = "Constant"
rate = 100

[scenarios.streaming.message_size]
type = "Range"
min = 4096
max = 65536

[scenarios.streaming.streaming]
stream_count = 50
stream_duration = "30s"
chunk_size = 8192
bidirectional = true

[scenarios.burst]
name = "Burst Traffic Test"
description = "Handle sudden traffic spikes"
duration = "120s"
connections = 1000
backend = "quinn"

[scenarios.burst.request_rate]
type = "Burst"
base_rate = 500
burst_rate = 5000
burst_duration = "10s"

[scenarios.burst.message_size]
type = "Fixed"
size = 512

[scenarios.stress]
name = "Resource Exhaustion Test"
description = "System behavior under resource constraints"
duration = "600s"
connections = 2000
backend = "quinn"

[scenarios.stress.request_rate]
type = "Variable"
pattern = "ramp"
base_rate = 1000
variation = 2.0

[scenarios.stress.message_size]
type = "Range"
min = 1024
max = 32768

[scenarios.stress.network_conditions]
latency = "20ms"
packet_loss = 0.001
jitter = "5ms"

[performance]
warmup_duration = "30s"
cooldown_duration = "10s"
metrics_interval = "100ms"

[performance.thresholds]
max_latency_p99 = "100ms"
min_throughput = 10000
max_error_rate = 0.001
max_memory_mb = 1024
max_cpu_percent = 80.0

[regression]
confidence_level = 0.95
significance_threshold = 0.05
minimum_samples = 100
retention = "30d"

[regression.storage]
type = "File"
path = "baselines"

[reporting]
output_dir = "reports"
formats = ["json", "html"]
include_graphs = true
include_raw_data = false
dashboard_port = 8080