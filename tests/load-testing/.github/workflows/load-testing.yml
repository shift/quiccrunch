# QuicCrunch Load Testing CI Integration
name: Load Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run load tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Cache Cargo Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build Load Testing Framework
      run: |
        cd tests/load-testing
        cargo build --release
    
    - name: Run Simple Load Test
      run: |
        cd tests/load-testing
        cargo run --bin load-test -- run \
          --scenario simple \
          --duration 60s \
          --output ci_reports/simple_${{ github.run_id }}
    
    - name: Run Stress Test (Quick Mode)
      run: |
        cd tests/load-testing
        cargo run --bin stress-test -- suite --quick \
          --output ci_reports/stress_${{ github.run_id }}
    
    - name: Run E2E Tests
      run: |
        cd tests/load-testing
        cargo run --bin e2e-test -- suite --quick \
          --output ci_reports/e2e_${{ github.run_id }}
    
    - name: Performance Regression Check
      if: github.event_name == 'pull_request'
      run: |
        cd tests/load-testing
        # Create baseline if it doesn't exist
        if ! cargo run --bin regression-test -- list-baselines | grep -q "main-baseline"; then
          echo "Creating main baseline..."
          cargo run --bin regression-test -- create-baseline \
            --name main-baseline \
            --scenario simple \
            --runs 2
        fi
        
        # Check for regression
        cargo run --bin regression-test -- check \
          --baseline main-baseline \
          --threshold 15.0 \
          --scenario simple
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: load-test-reports-${{ github.run_id }}
        path: tests/load-testing/ci_reports/
        retention-days: 30
    
    - name: Comment PR with Results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Try to read the test results
          try {
            const reportsDir = 'tests/load-testing/ci_reports';
            const files = fs.readdirSync(reportsDir);
            const jsonFiles = files.filter(f => f.endsWith('.json'));
            
            if (jsonFiles.length === 0) {
              console.log('No JSON reports found');
              return;
            }
            
            // Read the first JSON report
            const reportPath = path.join(reportsDir, jsonFiles[0]);
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            
            const comment = `## 🚀 Load Test Results
            
            **Performance Score:** ${report.performance_analysis?.performance_score || 'N/A'}/100
            
            **Test Summary:**
            - Total Scenarios: ${report.summary?.total_scenarios || 0}
            - Success Rate: ${((report.summary?.successful_scenarios || 0) / (report.summary?.total_scenarios || 1) * 100).toFixed(1)}%
            - Average Throughput: ${(report.summary?.average_throughput || 0).toFixed(1)} RPS
            - P99 Latency: ${report.summary?.average_latency_p99 || 'N/A'}
            
            **Resource Usage:**
            - Peak CPU: ${report.performance_analysis?.resource_utilization?.cpu_peak || 'N/A'}%
            - Peak Memory: ${report.performance_analysis?.resource_utilization?.memory_peak || 'N/A'} MB
            
            📊 [Full Report Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Error reading test results:', error);
          }

  benchmark-comparison:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Build Load Testing Framework
      run: |
        cd tests/load-testing
        cargo build --release
    
    - name: Run Comprehensive Load Tests
      run: |
        cd tests/load-testing
        timestamp=$(date +%Y%m%d_%H%M%S)
        
        # Run all scenarios
        cargo run --bin load-test -- run-all \
          --output nightly_reports/comprehensive_$timestamp
    
    - name: Create Nightly Baseline
      run: |
        cd tests/load-testing
        baseline_name="nightly-$(date +%Y%m%d)"
        cargo run --bin regression-test -- create-baseline \
          --name "$baseline_name" \
          --scenario realistic \
          --runs 3
    
    - name: Performance Trend Analysis
      run: |
        cd tests/load-testing
        cargo run --bin regression-test -- trend-analysis \
          --pattern "nightly-*" \
          --count 7
    
    - name: Upload Nightly Reports
      uses: actions/upload-artifact@v3
      with:
        name: nightly-load-test-reports
        path: tests/load-testing/nightly_reports/
        retention-days: 90