[package]
name = "quiccrunch-python"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Python bindings for QuicCrunch high-performance QUIC transport"
homepage = "https://github.com/quiccrunch/quiccrunch"
repository = "https://github.com/quiccrunch/quiccrunch"

[lib]
name = "quiccrunch"
crate-type = ["cdylib"]

[dependencies]
quiccrunch-core = { path = "../../quiccrunch-core" }
quiccrunch-ffi = { path = "../../quiccrunch-ffi" }
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
once_cell = "1.19"

[build-dependencies]
pyo3-build-config = "0.20"

[workspace]
# Empty workspace to exclude from parent workspace

[features]
default = ["pyo3/extension-module"]