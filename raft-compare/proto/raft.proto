syntax = "proto3";

package raftbench;

// The same logical PartitionRaft contract used by the QuicCrunch schema,
// reduced to the two unary RPCs relevant to append latency.
service RaftBench {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
}

message RaftLogEntry {
  uint64 term = 1;
  uint64 index = 2;
  // bincode-encoded command, identical bytes to QuicCrunch LogEntry.data
  bytes command = 3;
}

message AppendEntriesRequest {
  uint64 partition_id = 1;
  uint64 term = 2;
  uint64 leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated RaftLogEntry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}

message RequestVoteRequest {
  uint64 partition_id = 1;
  uint64 term = 2;
  uint64 candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}
