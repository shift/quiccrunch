syntax = "proto3";

package benchmark;

// Benchmark service for comparing gRPC vs QUIC performance
service BenchmarkService {
  // Latency test: single request-response
  rpc LatencyTest(BenchmarkRequest) returns (BenchmarkResponse);
  
  // Flood test: continuous unidirectional stream
  rpc FloodTest(stream BenchmarkRequest) returns (BenchmarkResponse);
  
  // Stream test: bidirectional streaming
  rpc StreamTest(stream BenchmarkRequest) returns (stream BenchmarkResponse);
}

message BenchmarkRequest {
  // Unique identifier for this request
  string id = 1;
  
  // Timestamp when request was sent (microseconds since epoch)
  uint64 timestamp = 2;
  
  // Test data payload
  bytes payload = 3;
  
  // Test metadata
  string test_type = 4;
  uint32 sequence_number = 5;
}

message BenchmarkResponse {
  // Echo back the request ID
  string id = 1;
  
  // Server timestamp when response was generated
  uint64 timestamp = 2;
  
  // Response payload (can be empty for minimal latency)
  bytes payload = 3;
  
  // Status of the operation
  string status = 4;
  
  // Server-side metrics if available
  optional ServerMetrics metrics = 5;
}

message ServerMetrics {
  // Number of concurrent connections
  uint32 concurrent_connections = 1;
  
  // Total messages processed
  uint64 total_messages = 2;
  
  // Server CPU usage percentage
  float cpu_usage = 3;
  
  // Memory usage in bytes
  uint64 memory_usage = 4;
}